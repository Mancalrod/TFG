# ===========================================
# Render Blueprint - Despliegue automático
# ===========================================
# Docs: https://docs.render.com/blueprint-spec

services:
  # ---- Backend (Spring Boot) ----
  - type: web
    name: tfg-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

  # ---- Frontend (React SPA) ----
  - type: web
    name: tfg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tfg-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
