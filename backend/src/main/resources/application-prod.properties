# ===========================================
# PERFIL DE PRODUCCIÓN (Render + Neon PostgreSQL)
# ===========================================

# Base de datos Neon (PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate (producción)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desactivar consola H2 en producción
spring.h2.console.enabled=false

# Logging (producción)
logging.level.root=WARN
logging.level.com.tfg.gestionentregables=INFO

# ===========================================
# ONEDRIVE (Microsoft Graph API)
# ===========================================
onedrive.enabled=${ONEDRIVE_ENABLED:true}
onedrive.client-id=${ONEDRIVE_CLIENT_ID}
onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET}
onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI}
# Directorio de subida (en Render, /tmp es el único directorio escribible)
app.upload.dir=/tmp/uploads

# ===========================================
# CLOUDINARY (almacenamiento persistente en producción)
# ===========================================
cloudinary.enabled=${CLOUDINARY_ENABLED:true}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
