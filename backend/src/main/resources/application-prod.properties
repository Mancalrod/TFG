# ===========================================
# PERFIL DE PRODUCCIÓN (Render + PostgreSQL gestionado)
# ===========================================

# Base de datos PostgreSQL (Render, Supabase, Railway, etc.)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP (fallo rápido y timeouts explícitos)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=15000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate (producción)
# Flyway es la autoridad del esquema. Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===========================================
# FLYWAY (migraciones de base de datos)
# ===========================================
# Flyway añade las columnas que ddl-auto=update no aplicó correctamente en Neon
spring.flyway.enabled=true
# Necesario para bases de datos existentes sin historial de Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Desactivar consola H2 en producción
spring.h2.console.enabled=false

# Logging (producción)
logging.level.root=WARN
logging.level.com.tfg.gestionentregables=INFO

# ===========================================
# ONEDRIVE (Microsoft Graph API)
# ===========================================
onedrive.enabled=${ONEDRIVE_ENABLED:false}
onedrive.client-id=${ONEDRIVE_CLIENT_ID:}
onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET:}
onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI:}
# Directorio de subida (en Render, /tmp es el único directorio escribible)
app.upload.dir=/tmp/uploads

# ===========================================
# CLOUDINARY (almacenamiento persistente en producción)
# ===========================================
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
