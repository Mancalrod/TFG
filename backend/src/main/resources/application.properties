# ===========================================
# CONFIGURACIÓN GENERAL
# ===========================================
spring.application.name=gestion-entregables
server.port=${PORT:8080}

# Carga opcional de secretos locales (NO commitear application-local.properties)
spring.config.import=optional:classpath:application-local.properties

# ===========================================
# BASE DE DATOS POSTGRESQL (por defecto)
# ===========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tfgdb}
spring.datasource.username=${DATABASE_USER:tfg}
spring.datasource.password=${DATABASE_PASSWORD:tfg1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Consola H2 desactivada por defecto (activar con perfil h2)
spring.h2.console.enabled=false

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# SEGURIDAD (deshabilitada temporalmente para desarrollo)
# ===========================================
# Descomentar cuando configures OAuth2
# spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID
# spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET

# ===========================================
# SUBIDA DE ARCHIVOS
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Directorio donde se guardarán los archivos (cambiar en producción)
app.upload.dir=${user.home}/tfg-uploads

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.com.tfg.gestionentregables=DEBUG
logging.level.org.springframework.security=DEBUG

# ===========================================
# JWT
# ===========================================
app.jwt.secret=TuClaveSecretaMuyLargaYSeguraParaElTFGDeGestionEntregables2026AlMenos256Bits
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===========================================
# ONEDRIVE (Microsoft Graph API)
# ===========================================
# Integración con OneDrive habilitada mediante variable de entorno
onedrive.enabled=${ONEDRIVE_ENABLED:false}
# Credenciales tomadas de GitHub Secrets / Render environment
onedrive.client-id=${ONEDRIVE_CLIENT_ID:}
onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET:}
# URI ajustable según entorno (local o producción)
onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI:http://localhost:8080/api/onedrive/callback}
onedrive.root-folder=TFG-Entregables

# ===========================================
# SEEDER (solo desarrollo)
# ===========================================
app.seeder.admin-credential=admin123
app.seeder.prof-credential=prof123
app.seeder.alumno-credential=alumno123

# ===========================================
# ONEDRIVE / MICROSOFT GRAPH
# ===========================================
# Para habilitar la integración con OneDrive, configurar estos valores
# con los datos del App Registration de Azure AD.
# Si app.onedrive.enabled=false, se usará almacenamiento local.
app.onedrive.enabled=false
app.onedrive.tenant-id=YOUR_TENANT_ID
app.onedrive.client-id=YOUR_CLIENT_ID
app.onedrive.client-secret=YOUR_CLIENT_SECRET
# Carpeta raíz en el OneDrive del alumno
app.onedrive.student-folder=Entregas
# Carpeta raíz en el OneDrive del profesor
app.onedrive.professor-folder=Entregas Recibidas
# URI de redirección OAuth2 (debe coincidir con la configurada en Azure AD)
app.onedrive.redirect-uri=http://localhost:8080/api/oauth/microsoft/callback
