# ===========================================
# CONFIGURACIÓN GENERAL
# ===========================================
spring.application.name=gestion-entregables
server.port=${PORT:8080}

# Carga opcional de secretos locales (NO commitear application-local.properties)
spring.config.import=optional:classpath:application-local.properties

# ===========================================
# BASE DE DATOS POSTGRESQL (por defecto)
# ===========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tfgdb}
spring.datasource.username=${DATABASE_USER:tfg}
spring.datasource.password=${DATABASE_PASSWORD:tfg1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Consola H2 desactivada por defecto (activar con perfil h2)
spring.h2.console.enabled=false

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# FLYWAY (migraciones de base de datos)
# ===========================================
spring.flyway.enabled=true
# baseline-on-migrate aplica las migraciones sobre una BD existente sin historial Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===========================================
# SEGURIDAD (deshabilitada temporalmente para desarrollo)
# ===========================================
# Descomentar cuando configures OAuth2
# spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID
# spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET

# ===========================================
# SUBIDA DE ARCHIVOS
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# URL base del frontend para construir enlaces directos en correos de notificación
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# Directorio donde se guardarán los archivos (cambiar en producción)
app.upload.dir=${user.home}/tfg-uploads

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.com.tfg.gestionentregables=DEBUG
logging.level.org.springframework.security=INFO

# ===========================================
# JWT
# ===========================================
app.jwt.secret=${JWT_SECRET:tFGvQ5b2K3xA8wM1pN9rD4sJ6yH0uL7cZ2eR8mT3qW1nY5kP4xB9vC6dF2gH7jK}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===========================================
# EMAIL (SMTP local/dev, API HTTP transaccional en production)
# ===========================================
email.provider=${EMAIL_PROVIDER:auto}
email.from-name=${EMAIL_FROM_NAME:Polan}
email.from-email=${EMAIL_FROM_EMAIL:}
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:}
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# ===========================================
# ONEDRIVE (Microsoft Graph API)
# ===========================================
# Integración con OneDrive habilitada mediante variable de entorno
onedrive.enabled=${ONEDRIVE_ENABLED:false}
# Credenciales tomadas de GitHub Secrets / Render environment
onedrive.client-id=${ONEDRIVE_CLIENT_ID:}
onedrive.client-secret=${ONEDRIVE_CLIENT_SECRET:}
# URI ajustable según entorno (local o producción)
onedrive.redirect-uri=${ONEDRIVE_REDIRECT_URI:http://localhost:8080/api/onedrive/callback}
onedrive.root-folder=TFG-Entregables

# ===========================================
# SEEDER (solo desarrollo)
# ===========================================
app.seeder.admin-credential=admin123
app.seeder.prof-credential=prof123
app.seeder.alumno-credential=alumno123

# ===========================================
# ONEDRIVE / MICROSOFT GRAPH
# ===========================================
# Para habilitar la integración con OneDrive, configurar estos valores
# con los datos del App Registration de Azure AD.
# Si app.onedrive.enabled=false, se usará almacenamiento local.
app.onedrive.enabled=${APP_ONEDRIVE_ENABLED:false}
app.onedrive.tenant-id=${APP_ONEDRIVE_TENANT_ID:}
app.onedrive.client-id=${APP_ONEDRIVE_CLIENT_ID:}
app.onedrive.client-secret=${APP_ONEDRIVE_CLIENT_SECRET:}
# Carpeta raíz en el OneDrive del alumno
app.onedrive.student-folder=Entregas
# Carpeta raíz en el OneDrive del profesor
app.onedrive.professor-folder=Entregas Recibidas
# URI de redirección OAuth2 (debe coincidir con la configurada en Azure AD)
app.onedrive.redirect-uri=${APP_ONEDRIVE_REDIRECT_URI:http://localhost:8080/api/oauth/microsoft/callback}

# ===========================================
# CLOUDINARY (almacenamiento en la nube)
# ===========================================
# Deshabilitado por defecto en desarrollo (se usa almacenamiento local)
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
