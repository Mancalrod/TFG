# ===========================================
# CONFIGURACIÓN GENERAL
# ===========================================
spring.application.name=gestion-entregables
server.port=8080

# ===========================================
# BASE DE DATOS H2 (DESARROLLO)
# ===========================================
spring.datasource.url=jdbc:h2:mem:tfgdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# SEGURIDAD (deshabilitada temporalmente para desarrollo)
# ===========================================
# Descomentar cuando configures OAuth2
# spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID
# spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET

# ===========================================
# SUBIDA DE ARCHIVOS
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Directorio donde se guardarán los archivos (cambiar en producción)
app.upload.dir=${user.home}/tfg-uploads

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.com.tfg.gestionentregables=DEBUG
logging.level.org.springframework.security=DEBUG

# ===========================================
# JWT
# ===========================================
app.jwt.secret=TuClaveSecretaMuyLargaYSeguraParaElTFGDeGestionEntregables2026AlMenos256Bits
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
