# ===========================================
# PERFIL H2 (base de datos embebida)
# ===========================================
# Activar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# o con variable de entorno: SPRING_PROFILES_ACTIVE=h2

spring.datasource.url=jdbc:h2:file:./data/tfgdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway deshabilitado en perfil H2 (usa ddl-auto=create-drop)
spring.flyway.enabled=false

# Consola H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
