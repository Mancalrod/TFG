name: Keep Alive

on:
  schedule:
    # Cada 14 minutos, de lunes a domingo
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  keep-alive:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend para evitar cold start
        run: |
          curl -sf https://tfg-backend-jdjl.onrender.com/api/health || echo "Backend no respondió (puede estar arrancando)"
