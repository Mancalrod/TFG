name: Full Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x ./mvnw

      - name: Compilar y ejecutar tests
        run: ./mvnw verify --batch-mode --no-transfer-progress

  frontend:
    name: Lint, Unit, E2E & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v6

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Instalar Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E mockeadas
        run: npm run test:e2e

      - name: Build de produccion
        run: npm run build
