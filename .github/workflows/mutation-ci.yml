name: Mutation CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  backend-mutation:
    name: Backend mutation (PIT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permisos de ejecucion a mvnw
        run: chmod +x ./mvnw

      - name: Ejecutar mutation testing backend
        run: ./mvnw -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage --batch-mode --no-transfer-progress

      - name: Subir reporte PIT
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-report
          path: backend/target/pit-reports

  frontend-mutation:
    name: Frontend mutation (Stryker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar mutation testing frontend
        run: npm run test:mutation

      - name: Subir reporte Stryker
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation

